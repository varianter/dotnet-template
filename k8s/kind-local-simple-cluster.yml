# Running:
#   > kind create cluster --config kind.yaml
#
# Creates
#   - 1 control node configured to work with an nginx-ingress controller (must be enabled manually)
#   - 1 workers node
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # Configure one control node to work with an Nginx Ingress Controller
    # See: https://kind.sigs.k8s.io/docs/user/ingress/
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker